name: personal_mobile_app
description: "HYETI, a personal planner: calendar, body, wallet, watch list and notes, stored on the phone."
publish_to: 'none'

# versionName+versionCode. Raise both for every APK you hand out, or Android will not install it over the old one.
version: 1.6.0+14

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  sqflite: ^2.4.6
  path: ^1.9.1
  http: ^1.6.0
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3
  url_launcher: ^6.3.3
  file_picker: ^13.4.0
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  google_mlkit_barcode_scanning: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
